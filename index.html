  --ink:#2F2A1D;
  --muted:#52584A;
  --line:#BBD9BE;
  --terra:#166534;
  --terra-dark:#14532D;

*{
  box-sizing:border-box;
  max-width:100%
}

html{
  scroll-behavior:smooth;
  overflow-x:clip
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size:17px;
  line-height:1.8;
  overflow-x:clip
}

img,video,pre,table{
  max-width:100%
}

.font-display{
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing:-.02em;
  line-height:1.25
}

button,select,textarea,input{
  font:inherit
}

button{
  cursor:pointer
}

button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px
}

/* Single-column reading column — every section, header and footer share it. */

header > div, header > nav, main, footer > div:first-child{
  max-width:760px!important;
  margin-left:auto!important;
  margin-right:auto!important;
  width:100%!important
}

main{
  padding-left:28px!important;
  padding-right:28px!important;
  padding-bottom:32px!important;
  overflow-x:clip
}

main section{
  max-width:760px!important;
  padding-left:0!important;
  padding-right:0!important;
  padding-top:28px!important;
  padding-bottom:8px!important;
  scroll-margin-top:140px;
  overflow-x:clip
}

main section section{
  padding-top:8px!important;
  padding-bottom:0!important
}

/* Force ONE column everywhere inside main: no 2/3/5-column grids, no side-by-side flex rows. */

main .grid, main ul.grid, main ol.grid{
  display:grid!important;
  grid-template-columns:minmax(0,1fr)!important;
  gap:24px!important
}

main .flex{
  flex-wrap:wrap!important
}

main .justify-between, main .items-end, main .items-center.gap-4{
  flex-direction:column!important;
  align-items:stretch!important;
  justify-content:flex-start!important
}

main .justify-between > *, main .items-end > *{
  width:100%
}

main .flow-arrow, .flow-arrow{
  display:none!important
}

/* Headings: generous air above, consistent space below. */

main h2{
  line-height:1.25!important;
  margin-top:48px!important;
  margin-bottom:16px!important
}

main h3{
  line-height:1.35!important;
  margin-top:32px!important;
  margin-bottom:12px!important
}

main h3:first-child, main section > div > h3:first-child{
  margin-top:0!important
}

main p, main li, main legend, main label{
  line-height:1.8!important;
  overflow-wrap:break-word
}

main p{
  margin-top:0!important;
  margin-bottom:16px!important
}

main p:last-child{
  margin-bottom:0!important
}

main ul, main ol{
  margin-bottom:16px!important
}

main li{
  margin-bottom:12px!important
}

main .text-sm{
  font-size:16px
}

main .text-xs{
  font-size:13px;
  line-height:1.6
}

/* Every card: same breathing room. */

main .single-card, main section .single-card{
  margin-bottom:32px!important;
  padding:28px!important;
  border-radius:20px!important;
  line-height:1.8!important;
  width:100%!important;
  min-width:0!important
}

main .rounded-2xl.bg-\[var\(--surface-2\)\]{
  margin-bottom:16px!important;
  padding:20px!important
}

main pre{
  white-space:pre-wrap!important;
  overflow-wrap:anywhere!important;
  word-break:break-word!important;
  overflow-x:hidden!important;
  padding:24px!important;
  line-height:1.8!important
}

main textarea, main select, main input[type="text"], main input:not([type="checkbox"]){
  min-height:48px!important;
  padding:12px 16px!important;
  width:100%!important
}

/* Buttons: comfortable touch targets, never tiny, never overflowing. */

button{
  min-height:48px!important;
  padding:12px 20px!important;
  margin:8px!important;
  max-width:100%;
  white-space:normal!important;
  text-align:center;
  line-height:1.4
}

header button, footer button, [role="dialog"] button{
  margin:8px!important
}

header nav button{
  padding:12px 16px!important;
  margin:0!important
}

header nav{
  display:flex!important;
  flex-wrap:wrap!important;
  gap:8px!important;
  overflow:visible!important;
  overflow-x:visible!important
}

header .tab-scroll{
  overflow:visible!important;
  scrollbar-width:none
}

header .tab-scroll::-webkit-scrollbar{
  display:none
}

main button{
  margin:8px 0!important
}

main .flex button, main .grid button{
  margin:8px 0!important
}

@media (max-width:640px){
  main button, header button, footer button, [role="dialog"] button{
    width:100%!important;
    margin-left:0!important;
    margin-right:0!important
  }

  header nav button{
    width:auto!important;
    flex:1 1 46%!important
  }

  main{
    padding-left:28px!important;
    padding-right:28px!important
  }

  main .single-card, main section .single-card{

  }

  main h2{
    font-size:32px!important
  }

  header > div, header > nav{

    padding-right:20px!important
  }
}

/* Theme switcher */

.theme-switcher{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px
}

.theme-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:999px;
  padding:12px 16px!important;
  font-size:14px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
  transition:all .15s ease
}

.theme-btn:hover{
  border-color:var(--terra)
}

.theme-btn[aria-pressed="true"]{
  background:var(--terra);
  border-color:var(--terra);
  color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.14)
}

.theme-dot{
  width:14px;
  height:14px;
  border-radius:999px;
  flex:none;
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 0 0 1px var(--line)
}

.theme-btn[aria-pressed="true"] .theme-dot{
  border-color:#fff
}

footer{
  color:var(--muted);
  position:static!important;
  overflow-x:clip;
  padding-bottom:24px!important
}

/* Mobile overlay / stacking guard: header is the only sticky element (z-10, solid). */

header{
  position:sticky!important;
  top:var(--safe-area-inset-top)!important;
  z-index:10!important;
  background:var(--bg)!important
}

.theme-switcher{
  position:static!important;
  z-index:auto!important
}

main .single-card,.single-card{
  position:relative!important;
  z-index:auto!important
}

main .flow-arrow,.flow-arrow{
  position:static!important;
  z-index:auto!important
}

/* 42 watermark lives in the footer markup but is pinned, non-interactive, and low-z. */

footer > div > div:last-child{
  position:fixed!important;
  bottom:8px!important;
  right:12px!important;
  z-index:1!important;
  pointer-events:none!important;
  opacity:.12!important;
  margin:0!important
}

/* Agree Gate / dialogs are the only z-50 overlay, always centered, and removed from the DOM when dismissed. */

[role="dialog"]{
  z-index:50!important;
  align-items:center!important;
  justify-content:center!important;
  padding:24px!important
}

@media (max-width:768px){
  header{
    position:sticky!important;
    z-index:10!important
  }

  footer{
    position:static!important;
    padding-bottom:24px!important
  }

  main,footer{
    overflow-x:clip
  }
}

footer .text-neutral-500{
  color:var(--muted)
}

footer button{
  color:var(--ink);
  justify-content:flex-start
}

@media (prefers-color-scheme: dark){
  :root,[data-theme="savanna"]{
    --bg:#2A1D12;
    --surface:#3A2A1C;
    --surface-2:#4A3826;
    --ink:#FBF3E2;
    --muted:#D9C6A8;
    --line:#5B4630
  }

  [data-theme="snow"]{
    --bg:#0B1520;
    --surface:#132334;
    --surface-2:#1B3247;
    --ink:#EAF4FF;
    --muted:#B9CFE0;
    --line:#2E465E
  }

  [data-theme="forest"]{
    --bg:#14231A;
    --surface:#1E3327;
    --surface-2:#2A4636;
    --ink:#EFF9EF;
    --muted:#C4D6C6;
    --line:#3A5A44
  }
}

/* Minimal 64px header + right slide-in drawer (final architecture) */

.app-header{

/* One-card question flow */

  from{
    opacity:0;

  to{
    opacity:1;
    transform:translateX(0) scale(1)
  }

.one-card-enter{
  animation:one-card-in .32s ease both

.one-card{

.deck-option{

  text-align:left!important;
  border:2px solid var(--line)!important;

  color:var(--ink)!important;

  border-color:var(--terra)!important;
  color:#fff!important

.one-card fieldset{
  border:0!important;
  padding:0!important;
  margin:0!important
}

.one-card legend{
  padding:0!important

  border-color: var(--terra);
